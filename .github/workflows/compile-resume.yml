name: Compile Resume

on:
  push:
    paths:
      - "resume.tex"
      - ".github/workflows/compile-resume.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          latexmk_use_xelatex: false

      - name: Render PNG preview
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftoppm -png -r 150 -singlefile resume.pdf preview

      - name: Commit PDF and preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force resume.pdf preview.png
          git diff --staged --quiet || git commit -m "Build resume PDF [skip ci]"
          git push
